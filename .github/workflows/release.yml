name: Build FCT.exe
# Pushes (branches and v* tags) only build the exe, as an artifact: tags never create releases.
# Releases are made by hand on GitHub; when one is published, FCT.exe is built from its tag and attached to it.
on:
  push:
    branches: ['**']
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/FCT/FCT.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: FCT
          path: dist/FCT.exe

  # Only for a release published by hand: attaches the exe built from the release tag.
  #
  # GITHUB_TOKEN can only write here if Settings → Actions → General → Workflow permissions allows it ("Read and
  # write permissions"); the `permissions: contents: write` below cannot raise that limit. Otherwise add a repository
  # secret RELEASE_TOKEN (Settings → Secrets and variables → Actions) with a token that can write this repo's
  # contents: it is used instead of the default token.
  attach:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FCT
          path: dist
      - name: Attach FCT.exe to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/FCT.exe --clobber --repo "$GITHUB_REPOSITORY"
