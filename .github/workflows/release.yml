name: Build and release FCT.exe
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/FCT/FCT.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: FCT
          path: dist/FCT.exe

  # Only for tags: publishes the release with the GitHub CLI (no third-party action, write access only here).
  #
  # New repos default GITHUB_TOKEN to read-only: the `permissions: contents: write` below cannot raise it above
  # whatever Settings → Actions → General → Workflow permissions allows for the whole repository. If that setting
  # stays on "Read repository contents permission", `gh release create/upload` fails with the default token no
  # matter what this file says. To make this work without touching that setting, add a repository secret named
  # RELEASE_TOKEN (Settings → Secrets and variables → Actions → New repository secret) holding a GitHub token with
  # write access to this repo's contents (classic PAT, "repo" scope, or a fine-grained PAT scoped to this repo with
  # "Contents: Read and write"). When that secret exists, it is used instead of the default token; otherwise this
  # falls back to the default token, which works fine once "Read and write permissions" is enabled for the repo.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FCT
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/FCT.exe --clobber --repo "$GITHUB_REPOSITORY"
          else
            # No changelog in this app's releases: just the download.
            gh release create "$TAG" dist/FCT.exe --title "Fortnite Chest Tracker $TAG" --notes "Descarga **FCT.exe** y ábrelo (Windows 10 / 11, sin instalación). Si ya lo tienes, se actualiza solo." --latest --repo "$GITHUB_REPOSITORY"
          fi
