name: Build FCT.exe
# Pushes (branches and v* tags) only build the exe, as an artifact: tags never create releases.
# Releases are made by hand on GitHub. FCT.exe is attached to a release:
#  - by itself when the release is published, if its tag already has this workflow;
#  - by hand for any tag: Actions → "Build FCT.exe" → Run workflow → write the tag (e.g. v3.4.1). The workflow of the
#    branch you run it from (main) is used, so this also works for tags made before this file existed.
on:
  push:
    branches: ['**']
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach FCT.exe to (e.g. v3.4.1). Empty: only build.'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        shell: pwsh
        env:
          BUILD_TAG: ${{ inputs.tag != '' && inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
        run: |
          # The project file moved over time; older tags still have it in one of the earlier places.
          $project = @('src/FCT.csproj', 'src/FCT/FCT.csproj', 'src/ChestCounter/ChestCounter.csproj') | Where-Object { Test-Path $_ } | Select-Object -First 1
          $versionArgs = @()
          if ($env:BUILD_TAG -match '^v(\d+\.\d+\.\d+)$') {
            $versionArgs += "-p:Version=$($Matches[1])"
          }
          dotnet publish $project -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none @versionArgs -o dist
          if (-not (Test-Path dist/FCT.exe)) { Get-ChildItem dist/*.exe | Select-Object -First 1 | Rename-Item -NewName FCT.exe }
      - uses: actions/upload-artifact@v4
        with:
          name: FCT
          path: dist/FCT.exe

  # Attaches the exe to the release (published by hand, or the tag given to "Run workflow").
  #
  # GITHUB_TOKEN can only write here if Settings → Actions → General → Workflow permissions allows it ("Read and
  # write permissions"); the `permissions: contents: write` below cannot raise that limit. Otherwise add a repository
  # secret RELEASE_TOKEN (Settings → Secrets and variables → Actions) with a token that can write this repo's
  # contents: it is used instead of the default token.
  attach:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FCT
          path: dist
      # The same exe also goes as ChestCounter.exe: the versions published before the rename only update from an
      # asset with that exact name (and only when their own file is called that). Once updated they run FCT and
      # look for FCT.exe from then on. Keep this copy while anyone may still run a pre-rename version.
      - name: Attach FCT.exe (and the copy for pre-rename versions) to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          cp dist/FCT.exe dist/ChestCounter.exe
          gh release upload "$TAG" dist/FCT.exe dist/ChestCounter.exe --clobber --repo "$GITHUB_REPOSITORY"
